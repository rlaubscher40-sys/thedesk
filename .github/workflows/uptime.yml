name: Uptime check

# Read-only checkout for the standalone external probe.
permissions:
  contents: read

# Requests a probe every 5 minutes; actual scheduling can be delayed.
# Pings /api/healthz from GitHub's infrastructure,
# then posts the result back to /api/uptime/record so the admin
# /health panel can render uptime history. Runs outside Railway so
# the monitor survives the app going down.

on:
  schedule:
    # Desired cadence only. The admin view separately reports sampling coverage.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check application health and record independently
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://thedesk.au' }}
          SCHEDULED_API_KEY: ${{ secrets.SCHEDULED_API_KEY }}
        run: node scripts/uptime-check.mjs
