name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * 0"
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          output: codeql-results
      - name: Require a clean CodeQL report
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          reports = list(pathlib.Path("codeql-results").glob("*.sarif"))
          if not reports:
              sys.exit("CodeQL did not produce a SARIF report")
          findings = []
          for report in reports:
              for run in json.loads(report.read_text()).get("runs", []):
                  for result in run.get("results", []):
                      if result.get("kind", "fail") != "fail":
                          continue
                      findings.append(result)
                      location = (result.get("locations") or [{}])[0].get("physicalLocation", {})
                      path = location.get("artifactLocation", {}).get("uri", "unknown")
                      line = location.get("region", {}).get("startLine", 1)
                      print(f"CodeQL finding: {result.get('ruleId')} at {path}:{line}")
          print(f"CodeQL findings: {len(findings)}")
          sys.exit(1 if findings else 0)
          PY
